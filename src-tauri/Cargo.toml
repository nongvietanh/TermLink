[package]
name = "termlink"
version = "0.2.0"
description = "TermLink - remote access and server management workspace"
authors = ["TermLink contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "termlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
portable-pty = "0.9"
zeroize = "1"
tokio-util = "0.7"
bytes = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
rand = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
